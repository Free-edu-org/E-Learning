services:
  mysql:
    image: mysql:8.0
    container_name: freeedu-mysql-prod
    environment:
      MYSQL_DATABASE: freeedu
      MYSQL_USER: freeedu
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/free-edu-org/freeedu-backend:latest
    container_name: freeedu-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: freeedu
      DB_USER: freeedu
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      FRONTEND_BASE_URL: https://${DOMAIN_NAME}
      STT_BASE_URL: http://stt-service:8000
      CORS_ALLOWED_ORIGINS: https://${DOMAIN_NAME}
      MAIL_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: ghcr.io/free-edu-org/freeedu-frontend:latest
    container_name: freeedu-frontend-prod
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend

  stt-service:
    image: ghcr.io/free-edu-org/freeedu-stt:latest
    container_name: freeedu-stt-prod
    environment:
      STT_MODEL_SIZE: base
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      STT_LANGUAGE: en

  caddy:
    image: caddy:2-alpine
    container_name: freeedu-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  mysql_prod_data:
  caddy_data:
  caddy_config:
