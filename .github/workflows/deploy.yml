name: Deploy FreeEdu

on:
  push:
    branches:
      - deploy/azure-prod
    paths:
      - "backend/**"
      - "frontend/**"
      - "stt-service/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Backend
        run: |
          docker build -t ghcr.io/free-edu-org/freeedu-backend:${{ github.sha }} -f backend/Dockerfile.prod backend
          docker tag ghcr.io/free-edu-org/freeedu-backend:${{ github.sha }} ghcr.io/free-edu-org/freeedu-backend:latest
          docker push ghcr.io/free-edu-org/freeedu-backend:${{ github.sha }}
          docker push ghcr.io/free-edu-org/freeedu-backend:latest

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: freeedu-backend
          resourceGroup: freeedu-rg
          imageToDeploy: ghcr.io/free-edu-org/freeedu-backend:${{ github.sha }}

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Frontend
        run: |
          docker build -t ghcr.io/free-edu-org/freeedu-frontend:${{ github.sha }} -f frontend/Dockerfile.prod frontend
          docker tag ghcr.io/free-edu-org/freeedu-frontend:${{ github.sha }} ghcr.io/free-edu-org/freeedu-frontend:latest
          docker push ghcr.io/free-edu-org/freeedu-frontend:${{ github.sha }}
          docker push ghcr.io/free-edu-org/freeedu-frontend:latest

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: freeedu-frontend
          resourceGroup: freeedu-rg
          imageToDeploy: ghcr.io/free-edu-org/freeedu-frontend:${{ github.sha }}

  deploy-stt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push STT Service
        run: |
          docker build -t ghcr.io/free-edu-org/freeedu-stt:${{ github.sha }} -f stt-service/Dockerfile.prod stt-service
          docker tag ghcr.io/free-edu-org/freeedu-stt:${{ github.sha }} ghcr.io/free-edu-org/freeedu-stt:latest
          docker push ghcr.io/free-edu-org/freeedu-stt:${{ github.sha }}
          docker push ghcr.io/free-edu-org/freeedu-stt:latest

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: freeedu-stt
          resourceGroup: freeedu-rg
          imageToDeploy: ghcr.io/free-edu-org/freeedu-stt:${{ github.sha }}

  deploy-vps-commercial:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-stt]
    # Docelowy model komercyjny (Self-Hosted): Uruchamia się tylko jeśli wdrożenie dotyczy klienta VPS
    if: ${{ env.DEPLOY_TARGET == 'vps' || secrets.VPS_HOST != '' }}
    steps:
      - name: Deploy to Client VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/freeedu
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-stt, deploy-vps-commercial]
    if: always()
    steps:
      - name: Microsoft Teams Notification
        run: |
          STATUS="SUCCESS"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            STATUS="FAILED"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "text": "Deployment finished with status: ${STATUS}",
            "status": "${STATUS}",
            "application": "FreeEdu",
            "branch": "${GITHUB_REF_NAME}",
            "sha": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "runNumber": "${GITHUB_RUN_NUMBER}",
            "runId": "${GITHUB_RUN_ID}",
            "actor": "${GITHUB_ACTOR}",
            "repository": "${GITHUB_REPOSITORY}",
            "runUrl": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          )

          echo "Sending Teams payload:"
          echo "${PAYLOAD}"

          curl --fail-with-body -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"
